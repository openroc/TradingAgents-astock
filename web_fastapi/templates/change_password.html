{% extends "base.html" %}
{% block title %}修改密码 — XT{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <div class="bg-gray-900 border border-gray-800 rounded-xl p-8">
    <h1 class="text-xl font-bold text-emerald-400 mb-6">修改密码</h1>

    <div id="error-msg" class="hidden bg-red-900/50 border border-red-800 text-red-300 text-sm rounded-lg px-4 py-3 mb-4"></div>
    <div id="success-msg" class="hidden bg-green-900/50 border border-green-800 text-green-300 text-sm rounded-lg px-4 py-3 mb-4">
      密码修改成功！
    </div>

    <form id="change-form" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">当前密码</label>
        <input type="password" name="current_password" id="current_password"
               autocomplete="current-password"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500"
               required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">新密码 <span class="text-gray-500 text-xs">(至少4位)</span></label>
        <input type="password" name="new_password" id="new_password"
               autocomplete="new-password" minlength="4"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500"
               required>
      </div>
      <button type="submit"
              id="submit-btn"
              class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition">
        确认修改
      </button>
      <a href="/" class="block w-full text-center border border-gray-700 hover:border-gray-600 text-gray-400 hover:text-white py-3 rounded-lg transition">
        返回首页
      </a>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById('change-form');
const errorMsg = document.getElementById('error-msg');
const successMsg = document.getElementById('success-msg');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.classList.add('hidden');
  successMsg.classList.add('hidden');
  submitBtn.disabled = true;
  submitBtn.textContent = '修改中...';

  const current_password = document.getElementById('current_password').value;
  const new_password = document.getElementById('new_password').value;

  if (new_password.length < 4) {
    errorMsg.textContent = '新密码至少4位';
    errorMsg.classList.remove('hidden');
    submitBtn.disabled = false;
    submitBtn.textContent = '确认修改';
    return;
  }

  try {
    const resp = await fetch('/auth/password', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current_password, new_password }),
      credentials: 'include',
    });

    if (resp.ok) {
      successMsg.classList.remove('hidden');
      form.reset();
    } else {
      const err = await resp.json().catch(() => ({ detail: '修改失败' }));
      errorMsg.textContent = err.detail || '修改失败';
      errorMsg.classList.remove('hidden');
    }
  } catch (err) {
    errorMsg.textContent = '网络错误，请重试';
    errorMsg.classList.remove('hidden');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '确认修改';
  }
});
</script>
{% endblock %}
