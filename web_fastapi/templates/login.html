{% extends "base.html" %}
{% block title %}登录 — XT投研辅助系统{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <div class="bg-gray-900 border border-gray-800 rounded-xl p-8">
    <h1 class="text-2xl font-bold text-emerald-400 mb-6 text-center">XT投研辅助系统</h1>

    <div id="error-msg" class="hidden bg-red-900/50 border border-red-800 text-red-300 text-sm rounded-lg px-4 py-3 mb-4"></div>

    <form id="login-form" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">用户名</label>
        <input type="text" name="username" id="username"
               autocomplete="username"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500"
               required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">密码</label>
        <input type="password" name="password" id="password"
               autocomplete="current-password"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500"
               required>
      </div>
      <button type="submit"
              class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition">
        登录
      </button>
    </form>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById('login-form');
const errorMsg = document.getElementById('error-msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.classList.add('hidden');

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    const resp = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
      credentials: 'include',
    });

    if (resp.ok) {
      const data = await resp.json();
      if (data.token) localStorage.setItem('session_token', data.token);
      window.location.href = '/';
    } else {
      const err = await resp.json().catch(() => ({ detail: 'Login failed' }));
      errorMsg.textContent = err.detail || '登录失败';
      errorMsg.classList.remove('hidden');
    }
  } catch (err) {
    errorMsg.textContent = '网络错误，请重试';
    errorMsg.classList.remove('hidden');
  }
});
</script>
{% endblock %}
